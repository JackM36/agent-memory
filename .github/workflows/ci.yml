name: PR Validation

# Every change reaches main through a pull request. The squash-merge commit takes the PR title, and the
# release workflow reads those titles to decide the next version, so the title format is checked here.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title (conventional)
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          pr_metadata="${PR_TITLE}"$'\n'"${PR_BODY:-}"
          normalized_metadata="${pr_metadata,,}"
          skip_pattern='\[(skip ci|ci skip|no ci|skip actions|actions skip|skip-ci)\]|skip-checks:[[:space:]]*true'
          if [[ "${normalized_metadata}" =~ ${skip_pattern} ]]; then
            echo "::error::PR titles and bodies must not skip the release workflow."
            exit 1
          fi

          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([A-Za-z0-9._/-]+\))?(!)?: .+'
          if [[ "${PR_TITLE}" =~ ${pattern} ]]; then
            echo "PR title is conventional: ${PR_TITLE}"
            exit 0
          fi

          echo "::error::PR title must follow Conventional Commits, for example 'feat: add brain update' or 'fix(mcp): route saves by kind'."
          exit 1

  release-tooling:
    name: Release tooling
    needs: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Test release configuration
        run: npm test

  build-test:
    name: Build and test (${{ matrix.os }})
    needs: pr-title
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build AgentBrain.slnx -c Release

      - name: Test
        run: dotnet test --solution AgentBrain.slnx -c Release --no-build

      - name: Retrieval evaluation gate
        # Accepted baseline: 38/43 variants (0.884), no irrelevant results (eval/baselines/phase5-porter.json).
        run: dotnet run --project eval/AgentBrain.Evaluation -c Release --no-build -- --phase 5 --min-pass 0.85 --max-irrelevant 0

      - name: Publish brain (Native AOT)
        run: dotnet publish src/AgentBrain.Cli -c Release -r ${{ matrix.rid }} -o artifacts/brain

      - name: Smoke test the AOT binary
        shell: bash
        run: ./artifacts/brain/brain --version
