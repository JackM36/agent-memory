name: release

# Push a tag such as v1.0.0 to build and publish a release (plan §9.7).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build AgentBrain.slnx -c Release
      - run: dotnet test --solution AgentBrain.slnx -c Release --no-build
      - name: Retrieval evaluation gate
        run: dotnet run --project eval/AgentBrain.Evaluation -c Release --no-build -- --phase 5 --min-pass 0.85 --max-irrelevant 0

  binaries:
    needs: verify
    name: binaries (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native AOT cannot cross-compile between operating systems, and Linux arm64 needs an arm64 runner.
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-13, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish brain (Native AOT)
        run: dotnet publish src/AgentBrain.Cli -c Release -r ${{ matrix.rid }} -o out/brain

      - name: Publish brain-server (self-contained)
        run: dotnet publish src/AgentBrain.Server -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o out/brain-server

      - name: Smoke test
        shell: bash
        run: |
          ./out/brain/brain --version
          ./out/brain-server/brain-server --help

      - name: Archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for tool in brain brain-server; do
            name="$tool-$version-${{ matrix.rid }}"
            rm -f out/$tool/*.pdb out/$tool/*.dbg
            if [[ "${{ matrix.rid }}" == win-* ]]; then
              (cd out/$tool && 7z a -tzip "../../dist/$name.zip" . > /dev/null)
            else
              tar -C out/$tool -czf "dist/$name.tar.gz" .
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*

  publish-release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Agent Brain $GITHUB_REF_NAME" \
            --notes "Binaries are not code-signed. Verify downloads against SHA256SUMS. See docs/deployment.md for the server image."

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agent-brain-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
